[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kioku"
version = "1.0.0"
description = "Offline photo search for Windows: find photos by describing them, clean up duplicates and blurry shots."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyQt6==6.11.0",
    "onnxruntime-directml==1.24.4",
    "tokenizers==0.23.2",
    "numpy==2.4.6",
    "pillow==12.3.0",
    "pillow-heif==1.8.0",
    "Send2Trash==2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller==6.22.3"]

[project.gui-scripts]
kioku = "kioku.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kioku = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyqt6"
